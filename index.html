<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EtSeDeSe Dummy Student Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "hc-red": "#990000" /* Crimson Red */,
              "hc-blue": "#000066" /* Navy Blue */,
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-100 font-sans pb-20">
    <!-- Navigation Bar-->
    <nav class="bg-hc-blue text-white py-5 px-8 shadow-md sticky top-0 z-10">
      <div class="max-w-7xl mx-auto flex items-center gap-4">
        <h1 class="text-3xl font-bold flex items-center gap-3">
          <span class="text-hc-red text-4xl bg-white px-2 py-1 rounded shadow"
            >+</span
          >
          EtSeDeSe

          <span
            class="text-lg opacity-90 font-medium tracking-wide border-l border-white/30 pl-4 ml-2"
          >
            Student Portal
          </span>
        </h1>
      </div>
    </nav>

    <!-- Main Layout -->
    <div class="max-w-7xl mx-auto mt-8 px-6 flex flex-col md:flex-row gap-8">
      <!-- sidebar-->
      <aside class="md:w-1/4">
        <div class="bg-white rounded-xl shadow-lg p-4 sticky top-28">
          <p
            class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 px-4"
          >
            Menu
          </p>

          <ul class="space-y-2">
            <li>
              <button
                onclick="switchTab('dashboard')"
                id="nav-dashboard"
                class="w-full text-left px-4 py-3 rounded-lg font-bold transition-colors bg-hc-blue text-white"
              >
                Dashboard
              </button>
            </li>
            <li>
              <button
                onclick="switchTab('feedback')"
                id="nav-feedback"
                class="w-full text-left px-4 py-3 rounded-lg font-bold text-gray-600 hover:bg-gray-100 transition-colors bg-hc-blue text-white"
              >
                Feedback Center
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <!-- content area -->
      <main class="md:w-3/4">
        <!-- dashboard view-->
        <section id="view-dashboard" class="space-y-8 animate-fade-in">
          <h2
            class="text-2xl font-bold text-gray-800 border-b-2 border-gray-200 pb-2"
          >
            Student Dashboard
          </h2>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-9">
            <!-- student profile -->
            <div
              class="bg-white rounded-xl shadow-lg border-t-8 border-hc-red p-8 text-center"
            >
              <h3
                class="text-lg font-bold text-gray-800 border-b-2 border-gray-100 pb-3 mb-6"
              >
                Digital ID Card
              </h3>

              <div id="profile-loading" class="animate-pulse py4">
                <div
                  class="w-32 h-32 bg-gray-200 rounded-full mx-auto mb-6"
                ></div>
                <div class="h-5 bg-gray-200 rounded w-2/3 mx-auto mb-3"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
              </div>

              <div id="profile-data" class="hidden py-4">
                <img
                  id="student-photo"
                  src=""
                  alt="Student"
                  class="w-32 h-32 rounded-full mx-auto mb-6 border-4 border-gray-100 shadow-sm"
                />
                <h4
                  id="student-name"
                  class="text-2xl font-bold text-hc-blud mb-1"
                ></h4>
                <p id="student-email" class="text-gray-500 text-base mb-6"></p>
                <span
                  class="bg-green-100 text-green-800 border border-green-300 text-sm font-bold px-4 py-2 rounded-full uppercase tracking-wide"
                  >Officially Enrolled</span
                >
              </div>
            </div>

            <!-- campus news -->

            <div
              class="bg-white rounded-xl shadow-lg border-t-8 border-hc-blue p-8"
            >
              <div
                class="flex justify-between items-center border-b-2 border-gray-100 pb-3 mb-6"
              >
                <h3 class="text-lg font-bold text-gray-800">Campus News</h3>
                <button
                  onclick="loadNews()"
                  class="text-sm font-bold text-hc-blue hover:text-hc-red transition-colors"
                >
                  Refresh
                </button>
              </div>

              <div id="news-loading" class="text-gray-500 italic">
                Connecting to a news server...
              </div>
              <div id="news-container" class="space-y-4"></div>
            </div>
          </div>
        </section>

        <!-- feedback center view-->
        <section id="view-feedback" class="hidden space-y-8 animate-fade-in">
          <h2
            class="text-2xl font-bold text-gray-800 border-b-2 border-gray-200 pb-2"
          >
            Feedback Center
          </h2>

          <!-- LEFT: Form Input Fields -->
          <div
            class="lg:col-span-1 bg-white rounded-xl shadow-lg p-6 border-t-8 border-hcdc-red h-fit sticky top-28"
          >
            <h3
              id="form-heading"
              class="text-lg font-bold text-gray-800 border-b-2 border-gray-100 pb-3 mb-6"
            >
              New Feedback
            </h3>

            <form id="feedback-form">
              <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2"
                  >Subject</label
                >
                <input
                  type="text"
                  id="feedback-title"
                  class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-hc-blue"
                  required
                />
              </div>

              <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2"
                  >Message</label
                >
                <textarea
                  id="feedback-body"
                  class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-hc-blue"
                  required
                ></textarea>
              </div>

              <button
                type="submit"
                id="submit-btn"
                class="bg-hc-blue hover:bg-blue-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors w-full"
              >
                Submit Feedback
              </button>

              <button
                type="button"
                id="cancel-edit-btn"
                onclick="cancelEdit()"
                class="hidden mt-3 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-lg transition-colors"
              >
                Cancel Edit
              </button>

              <p id="feedback-status" class="mt-4 text-sm font-bold hidden"></p>
            </form>
          </div>

          <!-- LIST OF FEEDBACKS -->
          <div
            class="lg:col-span-3 bg-white rounded-xl shadow-lg p-6 border-t-8 border-hc-blue"
          >
            <h3
              class="text-lg font-bold text-gray-800 border-b-2 border-gray-100 pb-3 mb-6"
            >
              Your History
            </h3>

            <div id="history-loading" class="text-gray-500 italic">
              Loading your history...
            </div>
            <div id="history-container" class="space-y-4"></div>
          </div>
        </section>
      </main>
    </div>

    <style>
      .animate-fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

    <script>
      // global variable to track if we are editing (put) or creating (post)
      let currentEditingId = null;

      function switchTab(tabName) {
        document.getElementById("view-dashboard").classList.add("hidden");
        document.getElementById("view-feedback").classList.add("hidden");

        document.getElementById("nav-dashboard").className =
          "w-full text-left px-4 py-3 rounded-lg font-bold text-gray-600 hover:bg-gray-100 transition-colors";
        document.getElementById("nav-feedback").className =
          "w-full text-left px-4 py-3 rounded-lg font-bold text-gray-600 hover:bg-gray-100 transition-colors";

        document.getElementById(`view-${tabName}`).classList.remove("hidden");
        document.getElementById(`nav-${tabName}`).className =
          "w-full  text-left px-4 py-3 rounded-lg font-bold transition-colors bg-hc-blue text-white";
      }

      async function loadStudentProfile() {
        try {
          const response = await fetch("https://randomuser.me/api/");

          if (!response.ok) throw new Error("Network error");

          const data = await response.json();

          document.getElementById("student-photo").src =
            data.results[0].picture.large;
          document.getElementById("student-name").textContent =
            `${data.results[0].name.first} ${data.results[0].name.last}`;
          document.getElementById("student-email").textContent =
            data.results[0].email;

          document.getElementById("profile-loading").style.display = "none";
          document.getElementById("profile-data").style.display = "block";
        } catch (error) {
          document.getElementById("profile-loading").innerHTML =
            `<p class="text-red-500 font-bold py-4">Failed to load profile.<p>`;
        }
      }

      async function loadNews() {
        const container = document.getElementById("news-container");
        container.innerHTML = "";
        document.getElementById("news-loading").style.display = "block";

        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts?_limit=3",
          );
          const posts = await response.json();

          document.getElementById("news-loading").style.display = "none";

          posts.forEach((post) => {
            container.innerHTML += `
            <div class="p-4 bg-gray-50 border-l-4 border-hc-blue rounded">
              <h4 class="font-bold text-gray-800 capitalize mb-1">${post.title}</h4>
              <p class="text-sm text-gray-600">${post.body}</p>
            </div>
            `;
          });
        } catch (error) {
          container.innerHTML = '<p class="text-red-500">Network error.</p>';
        }
      }

      async function loadFeedbacks() {
        const container = document.getElementById("history-container");

        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts?userId=1&_limit=2",
          );

          const feedbacks = await response.json();

          document.getElementById("history-loading").style.display = "none";

          feedbacks.forEach((fb) =>
            renderFeedbackToUI(fb.id, fb.title, fb.body),
          );
        } catch (error) {
          container.innerHTML = `<p>Could not load history.</p>`;
        }
      }

      function renderFeedbackToUI(id, title, body) {
        const container = document.getElementById("history-container");

        let div = document.getElementById(`{feedback-${id}}`);

        if (!div) {
          div = document.createElement("div");
          div.id = `feedback-${id}`;
          div.className =
            "p-5 border border-gray-200 rounded-lg bg-white shadow-sm flex flex-col gap-3";
          container.prepend(div);
        }

        div.innerHTML = `
          <div>
            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-4">Ticket #${id}</span>

            <h4 class="font-bold text-hc-blue capitalize mb-1">${title}</h4>

            <p class="text-sm text-gray-600">${body}</p>
          </div>

          <div class="flex gap-2 justify-end border-t border-gray-100 pt-3 mt-1">
            <button onclick="startEdit(${id})">EDIT</button>
            <button onclick="deleteFeedback(${id})">REMOVE</button>
          </div>
        `;
      }

      // SUBMIT FEEDBACK (POST) OR (PUT)
      document
        .getElementById("feedback-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const btn = document.getElementById("submit-btn");
          const statusText = document.getElementById("feedback-status");
          const title = document.getElementById("feedback-title").value;
          const body = document.getElementById("feedback-body").value;

          btn.disabled = true;
          btn.textContent = "Communicating with server";
          statusText.classList.add("hidden");

          try {
            // if currentEditingId is null, so we are posting / creating
            // if currentEditingId has a number, we are putting / updating

            const isUpdating = currentEditingId !== null;

            const url = isUpdating
              ? `https://jsonplaceholder.typicode.com/posts/${currentEditingId}`
              : `https://jsonplaceholder.typicode.com/posts/`;

            const method = isUpdating ? "PUT" : "POST";

            const response = await fetch(url, {
              method: method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                id: currentEditingId,
                title: title,
                body: body,
                userId: 1,
              }),
            });

            const result = await response.json();

            renderFeedbackToUI(result.id, result.title, result.body);

            statusText.textContent = `Success! Feedback ${isUpdating ? 'Updated': 'Created'}`;
            statusText.className =
              "mt-4 text-sm font-bold text-green-600 block";

            cancelEdit();

          } catch (error) {
            statusText.textContent = `Connection error`;
            statusText.className = "mt-4 text-sm font-bold text-red-600 block";
          } finally {
            btn.disabled = false;
          }
        });

      // START FEEDBACK
      function startEdit(id) {
        // get text from the existing HTML DOM
        const card = document.getElementById(`feedback-${id}`);
        const currentTitle = card.querySelector('h4').textContent;
        const currentBody = card.querySelector('p').textContent;

        // put the content to the input fields
        document.getElementById('feedback-title').value = currentTitle;
        document.getElementById('feedback-body').value = currentBody;

        currentEditingId = id;
        document.getElementById('form-heading').textContent = `Editing Ticket # ${id}`;
        document.getElementById('submit-btn').textContent = 'Update Feedback';
        document.getElementById('submit-btn').className = 'bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors w-full';
        document.getElementById('cancel-edit-btn').classList.remove('hidden');
      }

      function cancelEdit() {
        currentEditingId = null;
        document.getElementById('feedback-title').value = '';
        document.getElementById('feedback-body').value = '';
        document.getElementById('form-heading').textContent = 'New Feedback';
        document.getElementById('submit-btn').textContent = 'Submit Feedback';
        document.getElementById('submit-btn').className = 'bg-hc-blue hover:bg-blue-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors w-full';
        document.getElementById('cancel-edit-btn').classList.add('hidden');
      }

      // DELETE FEEDBACK
      async function deleteFeedback(id) {
        const card = document.getElementById(`feedback-${id}`);
        card.style.opacity = '0.4';

        try {
          const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`, {
            method: 'DELETE'
          });

          if(response.ok) {
            card.remove();
          } else {
            throw new Error('Delete failed');
          }

        } catch(error) {
          card.style.opacity = '1';
          alert('Network error');
        }
      }

      loadStudentProfile();
      loadNews();
      loadFeedbacks();
    </script>
  </body>
</html>
